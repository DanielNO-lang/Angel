[build]
base = "site"
command = "echo 'Angel static production build'"
publish = "."

[[redirects]]
from = "/"
to = "/app.html"
status = 200

[[redirects]]
from = "/index.html"
to = "/app.html"
status = 200

[[headers]]
for = "/"
[headers.values]
Cache-Control = "no-store, max-age=0"

[[headers]]
for = "/app.html"
[headers.values]
Cache-Control = "no-store, max-age=0"

[[headers]]
for = "/app.js"
[headers.values]
Cache-Control = "no-store, max-age=0"

[[headers]]
for = "/app.css"
[headers.values]
Cache-Control = "no-store, max-age=0"
