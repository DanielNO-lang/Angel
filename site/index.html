<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#09090e"><title>Angel ✦</title>
<style>
:root{--bg:#09090e;--panel:#111119;--soft:#181722;--text:#f5f2fa;--muted:#96919f;--line:#ffffff12;--a:#a878ff;--ok:#64e6aa}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 65% 10%,#8b55ff18,transparent 28%),var(--bg);color:var(--text)}.app{min-height:100vh;display:flex}.side{width:260px;padding:18px 12px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{font-weight:800;letter-spacing:4px;padding:10px;font-size:14px}.brand b{color:var(--a);font-size:21px;margin-right:8px}.new,.nav button{border:0;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer;border-radius:12px}.new{padding:13px;margin:16px 2px;border:1px solid #a878ff44}.nav{display:grid;gap:4px}.nav button{padding:11px;color:var(--muted)}.nav button:hover{background:var(--soft);color:var(--text)}.grow{flex:1}main{flex:1;min-width:0;display:flex;flex-direction:column}header{height:70px;padding:0 28px;display:flex;align-items:center}.pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px}.dot{display:inline-block;width:7px;height:7px;background:var(--ok);border-radius:50%;margin-right:8px}.actions{margin-left:auto;display:flex;gap:8px}.signin{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 14px;cursor:pointer}section{flex:1;display:flex;justify-content:center;padding:7vh 24px 140px}.hero{max-width:820px;width:100%;text-align:center;align-self:center}.orb{width:108px;height:108px;margin:auto auto 24px;border-radius:50%;display:grid;place-items:center;font-size:32px;color:white;background:radial-gradient(circle,#d7c0ff,#7b45d7 45%,#7b45d711 70%);box-shadow:0 0 90px #8b55ff33}h1{font-size:clamp(42px,6vw,68px);letter-spacing:-3px;margin:0 0 13px}h1 span{color:var(--a)}.hero>p{max-width:650px;margin:auto;color:var(--muted);line-height:1.7;font-size:17px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:38px}.cards button{min-height:150px;padding:18px;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:18px;cursor:pointer}.cards strong,.cards small{display:block}.cards small{color:var(--muted);margin-top:9px;line-height:1.45}.messages{width:min(820px,100%)}.msg{display:grid;grid-template-columns:70px 1fr;border-bottom:1px solid var(--line);padding:20px 0}.msg b{font-size:11px;color:var(--a)}.msg p{margin:0;line-height:1.7;white-space:pre-wrap}.compose{position:fixed;bottom:0;left:260px;right:0;padding:25px 24px 8px;background:linear-gradient(transparent,var(--bg) 30%)}.box{max-width:820px;margin:auto;display:flex;gap:8px;padding:8px;border:1px solid var(--line);border-radius:22px;background:var(--panel)}textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:inherit;padding:11px}.send{width:42px;border:0;border-radius:13px;background:var(--a);color:#fff;font-size:20px;cursor:pointer}.send:disabled{opacity:.5}.compose small{display:block;text-align:center;color:var(--muted);margin:8px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px;z-index:5}.modal.open{display:grid}.auth{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:30px}.auth h2{margin-top:0}.auth p{color:var(--muted);line-height:1.6}.auth input,.auth button{width:100%;padding:13px;border-radius:12px;margin-top:10px}.auth input{border:1px solid var(--line);background:var(--bg);color:var(--text)}.auth button{border:0;background:var(--a);color:#fff;cursor:pointer}.status{min-height:22px;color:var(--muted);font-size:13px;margin-top:12px}.light{--bg:#f8f7fb;--panel:#fff;--soft:#f0eef7;--text:#191720;--muted:#746f7c;--line:#17121d14;--a:#7b45d7}@media(max-width:760px){.side{display:none}.compose{left:0}.cards{grid-template-columns:1fr}.hero{align-self:flex-start;margin-top:30px}header{padding:0 14px}.msg{grid-template-columns:55px 1fr}}
</style></head>
<body>
<div class="app"><aside class="side"><div class="brand"><b>✦</b>ANGEL</div><button class="new" id="newChat">＋ New conversation</button><div class="nav"><button>✦ Angel</button><button id="historyBtn">◷ History</button><button>⌕ Explore</button><button>▣ Projects</button></div><div class="grow"></div><div class="nav"><button>⚙ Settings</button><button id="sideAuth">◉ Sign in</button></div></aside>
<main><header><div class="pill"><span class="dot"></span><span id="brainStatus">Angel brain online</span></div><div class="actions"><button class="signin" id="themeBtn">Theme</button><button class="signin" id="authBtn">Sign in</button></div></header>
<section id="content"><div class="hero"><div class="orb">✦</div><h1>Hello. I’m <span>Angel.</span></h1><p>My body is online. My memory system is ready. Sign in to begin building a conversation that can persist with you.</p><div class="cards"><button onclick="suggest('Help me create something extraordinary')"><strong>✦ Create something</strong><small>Turn an idea into something real.</small></button><button onclick="suggest('Help me think through a difficult problem')"><strong>⌕ Think with me</strong><small>Explore a problem deeply.</small></button><button onclick="suggest('Help me organize a project')"><strong>▣ Build a project</strong><small>Give your work a home and direction.</small></button></div></div></section>
<div class="compose"><div class="box"><textarea id="message" rows="1" placeholder="Message Angel…"></textarea><button class="send" id="sendBtn">↑</button></div><small id="footerStatus">Sign in to unlock Angel's persistent conversations.</small></div></main></div>
<div class="modal" id="modal"><div class="auth"><h2>Enter Angel</h2><p>Use your email to receive a secure sign-in link.</p><input id="email" type="email" placeholder="you@example.com"><button id="magicBtn">Send sign-in link</button><button id="closeBtn" style="background:transparent;border:1px solid var(--line)">Cancel</button><div class="status" id="authStatus"></div></div></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL="https://ybvyveonfvixsfusoqqz.supabase.co";
const SUPABASE_KEY="sb_publishable_N5oJC6pzx87-z3pO8MgSwQ_djYeX8o9";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const input=document.querySelector("#message"),content=document.querySelector("#content"),sendBtn=document.querySelector("#sendBtn");
let conversationId=null,history=[];

const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
function suggest(t){input.value=t;input.focus()} window.suggest=suggest;
function messagesView(){if(!content.querySelector(".messages"))content.innerHTML='<div class="messages"></div>';return content.querySelector(".messages")}
function add(role,text){messagesView().insertAdjacentHTML("beforeend",'<div class="msg"><b>'+ (role==="user"?"YOU":"✦ ANGEL") +'</b><p>'+esc(text)+'</p></div>')}
async function session(){const {data}=await supabase.auth.getSession();return data.session}
async function refreshAuth(){const s=await session();document.querySelector("#authBtn").textContent=s?"Sign out":"Sign in";document.querySelector("#sideAuth").textContent=s?"◉ Sign out":"◉ Sign in";document.querySelector("#footerStatus").textContent=s?"Angel remembers this conversation securely in your account.":"Sign in to unlock Angel's persistent conversations."}
async function ensureConversation(text,userId){if(conversationId)return;const {data,error}=await supabase.from("conversations").insert({user_id:userId,title:text.slice(0,60)||"New conversation"}).select().single();if(error)throw error;conversationId=data.id}
async function send(){
 const text=input.value.trim();if(!text)return;
 const s=await session();if(!s){openAuth();return}
 input.value="";sendBtn.disabled=true;add("user",text);history.push({role:"user",content:text});
 try{
   await ensureConversation(text,s.user.id);
   await supabase.from("messages").insert({conversation_id:conversationId,user_id:s.user.id,role:"user",content:text});
   document.querySelector("#brainStatus").textContent="Angel is thinking…";
   const {data,error}=await supabase.functions.invoke("angel-chat",{body:{messages:history}});
   if(error)throw error;
   const reply=data?.reply||"Angel could not form a response.";
   add("assistant",reply);history.push({role:"assistant",content:reply});
   await supabase.from("messages").insert({conversation_id:conversationId,user_id:s.user.id,role:"assistant",content:reply});
 }catch(e){console.error(e);add("assistant",e.message||"Something interrupted Angel's thought process.")}
 finally{sendBtn.disabled=false;document.querySelector("#brainStatus").textContent="Angel brain online";window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
}
sendBtn.onclick=send;input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
function openAuth(){document.querySelector("#modal").classList.add("open")}function closeAuth(){document.querySelector("#modal").classList.remove("open")}
document.querySelector("#authBtn").onclick=async()=>{const s=await session();if(s){await supabase.auth.signOut();refreshAuth()}else openAuth()};
document.querySelector("#sideAuth").onclick=()=>document.querySelector("#authBtn").click();
document.querySelector("#closeBtn").onclick=closeAuth;
document.querySelector("#magicBtn").onclick=async()=>{const email=document.querySelector("#email").value.trim(),status=document.querySelector("#authStatus");if(!email){status.textContent="Enter your email first.";return}status.textContent="Sending secure link…";const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:window.location.origin}});status.textContent=error?error.message:"Check your email. Your Angel sign-in link is on its way."};
document.querySelector("#themeBtn").onclick=()=>document.body.classList.toggle("light");
document.querySelector("#newChat").onclick=()=>{conversationId=null;history=[];content.innerHTML='<div class="hero"><div class="orb">✦</div><h1>A new <span>thought begins.</span></h1><p>What would you like Angel to help you explore?</p></div>';};
document.querySelector("#historyBtn").onclick=async()=>{const s=await session();if(!s){openAuth();return}const {data}=await supabase.from("conversations").select("id,title,updated_at").order("updated_at",{ascending:false}).limit(20);alert((data||[]).map(x=>x.title).join("\n")||"No saved conversations yet.");};
supabase.auth.onAuthStateChange(()=>refreshAuth());refreshAuth();
</script></body></html>
