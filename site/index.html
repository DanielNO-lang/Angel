<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090f"><meta name="description" content="Angel, a private AI companion."><title>Angel</title><style>*{box-sizing:border-box}body{margin:0;background:#09090f;color:#f5f3fa;font:14px system-ui,sans-serif}.app{min-height:100vh;display:flex}.side{width:270px;padding:18px;background:#11111a;border-right:1px solid #ffffff12;display:flex;flex-direction:column}.main{flex:1;min-width:0}header{height:72px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid #ffffff12;position:sticky;top:0;background:#09090fee;backdrop-filter:blur(14px);z-index:3}.actions{margin-left:auto;display:flex;gap:8px}.btn,.iconBtn,.send,.new,.nav button{color:inherit;background:#14141e;border:1px solid #ffffff15;border-radius:12px;padding:10px;cursor:pointer}.btn:hover,.iconBtn:hover,.nav button:hover,.new:hover{border-color:#a879ff55}.brand{font-weight:800;letter-spacing:4px;padding:10px}.brand b{color:#a879ff;font-size:20px}.nav{display:grid;gap:5px;margin-top:18px}.nav button{text-align:left;color:#aaa;border:0}.grow{flex:1;min-height:35vh}.sideUser{color:#888;font-size:12px;padding:8px}.sideUser strong{display:block;color:white;margin-bottom:3px}.content{max-width:980px;margin:auto;padding:40px 28px 190px}.welcome{min-height:68vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.orb{width:92px;height:92px;border-radius:30px;display:grid;place-items:center;font-size:32px;background:radial-gradient(circle at 30% 20%,#a879ff,#5422a0 70%);box-shadow:0 0 90px #8b55ff30}.welcome h1{font-size:60px;margin:22px 0 10px}.welcome h1 span{color:#a879ff}.welcome p{max-width:650px;color:#999;line-height:1.7}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;margin-top:30px}.card{padding:18px;text-align:left;background:#12121b;border:1px solid #ffffff12;border-radius:18px;color:white;cursor:pointer}.card small{display:block;color:#999;margin-top:8px}.messages .msg{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:24px 0;border-bottom:1px solid #ffffff12}.role{color:#a879ff;font-size:11px;font-weight:800}.msg p{margin:0;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}.mini{margin-top:10px;background:transparent;color:#aaa;border:1px solid #ffffff15;border-radius:9px;padding:6px 9px;cursor:pointer}.composer{position:fixed;left:270px;right:0;bottom:0;padding:28px 24px 10px;background:linear-gradient(transparent,#09090f 35%);z-index:4}.composerTools,.box{max-width:920px;margin:auto}.composerTools{display:flex;gap:7px;align-items:center;margin-bottom:7px}.toolState{color:#999;font-size:11px}.box{display:flex;gap:7px;padding:8px 8px 8px 14px;background:#12121b;border:1px solid #ffffff18;border-radius:22px;box-shadow:0 10px 50px #0008}textarea{flex:1;min-height:44px;max-height:160px;resize:none;border:0;outline:0;background:transparent;color:white;padding:11px;font:inherit}.send{width:44px;background:#8a50e5}.iconBtn.active{border-color:#a879ff;color:#d6baff}.composer small{display:block;text-align:center;color:#777;margin:8px}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:10}.modal.open{display:grid}.auth{width:min(380px,90vw);padding:30px;background:#12121b;border-radius:22px}.auth button{width:100%;padding:13px;margin-top:10px}.statusText{color:#aaa;margin-top:12px}.panelTitle{font-size:28px;margin-bottom:18px}.list{display:grid;gap:10px}.listItem{padding:16px;background:#12121b;border:1px solid #ffffff12;border-radius:15px;color:white;text-align:left}.memoryRow{display:flex;justify-content:space-between;gap:10px}.sourceBox{margin-top:12px;padding:12px;border:1px solid #ffffff12;border-radius:13px;background:#12121b}.sourceBox a{color:#c8a9ff}.drop{outline:2px dashed #8a50e566;outline-offset:-5px}@media(max-width:760px){.side{display:none}.composer{left:0}.cards{grid-template-columns:1fr}.welcome h1{font-size:44px}.content{padding:30px 16px 180px}.messages .msg{grid-template-columns:55px 1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand"><b>✦</b> ANGEL</div><button class="new" id="newChat">＋ New conversation</button><div class="nav"><button id="angelBtn">✦ Angel</button><button id="historyBtn">◷ History</button><button id="exploreBtn">⌕ Explore</button><button id="projectsBtn">▣ Projects</button></div><div class="grow"></div><div class="sideUser" id="sideUser"></div><div class="nav"><button id="settingsBtn">⚙ Settings</button><button id="sideAuth">◉ Sign in</button></div></aside><main class="main"><header><div>✦ <span id="brainStatus">Angel brain online</span></div><div class="actions"><button class="btn" id="themeBtn">Theme</button><button class="btn" id="authBtn">Sign in</button></div></header><section class="content" id="content"></section><div class="composer"><div class="composerTools"><button class="iconBtn" id="micBtn" title="Voice input">🎙</button><button class="iconBtn" id="researchBtn" title="Web research">🌐</button><button class="iconBtn" id="uploadBtn" title="Upload image or document">📎</button><span class="toolState" id="toolState">Voice ready · Research off · Files ready</span><input id="fileInput" type="file" hidden accept="image/*,.pdf,.txt,.md,.csv,.doc,.docx"></div><div class="box"><textarea id="message" rows="1" placeholder="Message Angel…"></textarea><button class="send" id="sendBtn">↑</button></div><small id="footerStatus">Sign in to unlock persistent conversations.</small></div></main></div><div class="modal" id="modal"><div class="auth"><h2>Enter Angel</h2><p>Continue securely with your Google account.</p><button id="googleBtn">ⓖ Continue with Google</button><button id="closeBtn">Cancel</button><div class="statusText" id="authStatus"></div></div></div><script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const URL="https://ybvyveonfvixsfusoqqz.supabase.co",KEY="sb_publishable_N5oJC6pzx87-z3pO8MgSwQ_djYeX8o9",supabase=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=s=>document.querySelector(s),content=$("#content"),input=$("#message"),base=URL+"/functions/v1/",$tools=base+"angel-tools",$orch=base+"angel-orchestrator",$chat=base+"angel-chat",$memory=base+"angel-memory",$vision=base+"angel-vision",$docs=base+"angel-documents";let session=null,profile=null,conversationId=null,sending=false,recording=false,recorder=null,stream=null,researchMode=false,history=[];const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));const meta=u=>u?.user_metadata||{};const username=u=>profile?.username||meta(u).user_name||meta(u).preferred_username||meta(u).full_name||meta(u).name||u?.email?.split("@")[0]||"Angel user";function account(u){$("#authBtn").textContent=u?"Sign out":"Sign in";$("#sideAuth").textContent=u?"◉ Sign out":"◉ Sign in";$("#footerStatus").textContent=u?"Angel remembers this conversation securely in your account.":"Sign in to unlock persistent conversations.";$("#sideUser").innerHTML=u?`<strong>${esc(username(u))}</strong>${esc(u.email||"")}`:`<strong>Guest mode</strong>Sign in to save conversations.`}async function auth(){let{data}=await supabase.auth.getSession();session=data.session||null;if(session){let r=await supabase.from("profiles").select("*").eq("id",session.user.id).maybeSingle();profile=r.data||null}account(session?.user||null);return session}function welcome(){content.innerHTML=`<div class="welcome"><div class="orb">✦</div><h1>Hello. I’m <span>Angel.</span></h1><p>Your private AI companion for reasoning, research, memory, voice, vision, documents and agent workflows.</p><div class="cards"><button class="card" data-s="Help me create something extraordinary"><b>✦ Create something</b><small>Turn an idea into something real.</small></button><button class="card" data-s="Research this topic and explain the important findings"><b>🌐 Research this</b><small>Search the web and bring useful signal.</small></button><button class="card" data-s="Help me think through a difficult problem"><b>🧠 Think with me</b><small>Explore a problem deeply.</small></button></div></div>`;document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{input.value=b.dataset.s;send()})}function messages(){if(!content.querySelector(".messages"))content.innerHTML='<div class="messages"></div>';return content.querySelector(".messages")}function add(role,text,sources=[]){let d=document.createElement("div");d.className="msg";d.innerHTML=`<div class="role">${role==="user"?"YOU":"✦ ANGEL"}</div><div><p>${esc(text)}</p>${role==="assistant"?'<button class="mini speak">🔊 Listen</button>':''}${sources.length?`<div class="sourceBox"><b>Sources</b>${sources.slice(0,8).map((s,i)=>`<div>${i+1}. <a target="_blank" rel="noopener" href="${esc(s.url||s.link||"#")}">${esc(s.title||s.url||s.link||"Source")}</a></div>`).join("")}</div>`:""}</div>`;messages().append(d);d.querySelector(".speak")?.addEventListener("click",()=>speak(text));return d}async function call(path,body){if(!session)throw Error("Please sign in first.");let r=await fetch(path,{method:"POST",headers:{Authorization:`Bearer ${session.access_token}`,"Content-Type":"application/json","apikey":KEY},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.detail||`Request failed (${r.status})`);return d}async function send(){if(sending||!input.value.trim())return;if(!session){$("#modal").classList.add("open");return}let text=input.value.trim();input.value="";sending=true;add("user",text);history.push({role:"user",content:text});let thinking=add("assistant",researchMode?"Researching and thinking…":"Thinking…");try{let plan=await call($orch,{task:text,mode:researchMode?"research":"auto"});let sources=[];let context=[];if(researchMode||plan.research_required){let r=await call($tools,{action:"research",query:text,max_results:8});sources=r.results||[];if(sources.length)context.push({role:"system",content:"Web research results. Use these sources when relevant and do not invent citations:\n"+sources.map((s,i)=>`[${i+1}] ${s.title||"Source"}: ${s.url||s.link||""}\n${s.snippet||s.description||""}`).join("\n")})}let r=await call($chat,{messages:[...context,...history.slice(-20)]});conversationId=r.conversation_id||conversationId;thinking.remove();add("assistant",r.reply||"I’m ready.",sources);history.push({role:"assistant",content:r.reply||""})}catch(e){thinking.remove();add("assistant",e.message||"Angel could not complete that request.")}finally{sending=false}}async function speak(text){try{let d=await call($tools,{action:"speak",text});let b=atob(d.audio_base64),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);let au=new Audio(URL.createObjectURL(new Blob([a],{type:d.mime_type||"audio/wav"})));await au.play()}catch(e){alert(e.message)}}async function toggleMic(){if(recording){recorder.stop();return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});let chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=async()=>{recording=false;$("#micBtn").classList.remove("active");stream.getTracks().forEach(t=>t.stop());let blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"}),reader=new FileReader();reader.onload=async()=>{try{let d=await call($tools,{action:"transcribe",audio_base64:reader.result,mime_type:blob.type});input.value=d.text||"";if(d.text)send()}catch(e){alert(e.message)}};reader.readAsDataURL(blob)};recorder.start();recording=true;$("#micBtn").classList.add("active");$("#toolState").textContent="Listening… click mic to stop"}catch(e){alert("Microphone access is unavailable.")}}async function uploadFile(f){if(!session)return $("#modal").classList.add("open");add("user",`📎 ${f.name}`);try{let reader=new FileReader();reader.onload=async()=>{try{let data=String(reader.result).split(",")[1]||"";if(f.type.startsWith("image/")){let r=await call($vision,{image_base64:data,mime_type:f.type,prompt:"Analyze this image for the user. Describe useful visible details and read text when possible."});add("assistant",r.reply||"Image analyzed.")}else{let r=await call($docs,{action:"analyze",file_name:f.name,mime_type:f.type,data_base64:data});add("assistant",r.answer||r.reply||r.text||"Document analyzed.")}}catch(x){add("assistant",x.message)}};reader.readAsDataURL(f)}catch(x){add("assistant",x.message)}}$("#micBtn").onclick=toggleMic;$("#researchBtn").onclick=()=>{researchMode=!researchMode;$("#researchBtn").classList.toggle("active",researchMode);$("#toolState").textContent=`Voice ready · Research ${researchMode?"on":"off"} · Files ready`};$("#uploadBtn").onclick=()=>$("#fileInput").click();$("#fileInput").onchange=e=>{let f=e.target.files[0];if(f)uploadFile(f);e.target.value=""};$("#sendBtn").onclick=send;input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});$("#newChat").onclick=()=>{conversationId=null;history=[];welcome()};$("#angelBtn").onclick=welcome;$("#historyBtn").onclick=async()=>{if(!session)return $("#modal").classList.add("open");let r=await supabase.from("conversations").select("id,title,updated_at").order("updated_at",{ascending:false}).limit(30);content.innerHTML='<h2 class="panelTitle">History</h2><div class="list">'+(r.data||[]).map(x=>`<button class="listItem" data-id="${x.id}"><b>${esc(x.title||"Conversation")}</b><br><small>${new Date(x.updated_at).toLocaleString()}</small></button>`).join("")+'</div>';content.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>loadConversation(b.dataset.id))};async function loadConversation(id){conversationId=id;let r=await supabase.from("messages").select("role,content").eq("conversation_id",id).order("created_at",{ascending:true});history=(r.data||[]).map(x=>({role:x.role,content:x.content}));messages();messages().innerHTML="";history.forEach(x=>add(x.role,x.content))}$("#settingsBtn").onclick=async()=>{if(!session)return $("#modal").classList.add("open");let r=await call($memory,{action:"list",limit:30});content.innerHTML='<h2 class="panelTitle">Angel memory</h2><p style="color:#999">Only memories belonging to your signed-in account are shown here.</p><div class="list">'+(r.memories||[]).map(m=>`<div class="listItem"><div class="memoryRow"><div><b>${esc(m.kind)}</b><div>${esc(m.content)}</div><small>Importance ${m.importance}/5</small></div><button class="mini" data-del="${m.id}">Delete</button></div></div>`).join("")+'</div><div class="box" style="margin-top:18px"><textarea id="memoryInput" placeholder="Save a memory for Angel…"></textarea><button class="send" id="memorySave">+</button></div>';content.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{await call($memory,{action:"delete",id:b.dataset.del});$("#settingsBtn").click()});$("#memorySave").onclick=async()=>{let v=$("#memoryInput").value.trim();if(v){await call($memory,{action:"save",content:v,kind:"user",importance:4});$("#settingsBtn").click()}}};$("#exploreBtn").onclick=()=>{input.value="Research something useful for me";researchMode=true;$("#researchBtn").classList.add("active");send()};$("#projectsBtn").onclick=()=>{content.innerHTML='<h2 class="panelTitle">Projects</h2><div class="list"><div class="listItem"><b>Angel workspace</b><div style="color:#999;margin-top:6px">Projects and persistent workspaces are being prepared for the next agent layer.</div></div></div>'};$("#themeBtn").onclick=()=>{document.body.style.background=document.body.style.background==="rgb(9, 9, 15)"?"#f7f7fb":"#09090f"};$("#authBtn").onclick=async()=>{if(session){await supabase.auth.signOut();conversationId=null;history=[];welcome()}else $("#modal").classList.add("open");await auth()};$("#sideAuth").onclick=()=>$("#authBtn").click();$("#closeBtn").onclick=()=>$("#modal").classList.remove("open");$("#googleBtn").onclick=async()=>{await supabase.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin}})};document.body.addEventListener("dragover",e=>{e.preventDefault();document.body.classList.add("drop")});document.body.addEventListener("dragleave",()=>document.body.classList.remove("drop"));document.body.addEventListener("drop",e=>{e.preventDefault();document.body.classList.remove("drop");let f=e.dataTransfer.files[0];if(f)uploadFile(f)});supabase.auth.onAuthStateChange(()=>setTimeout(auth,0));await auth();welcome();</script></body></html>
