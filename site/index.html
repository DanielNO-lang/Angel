tton id="projectsBtn">▣ Projects</button></div><div class="grow"></div><div class="sideUser" id="sideUser"></div><div class="nav"><button id="settingsBtn">⚙ Settings</button><button id="sideAuth">◉ Sign in</button></div></aside><main class="main"><header><div>✦ <span id="brainStatus">Angel brain online</span></div><div class="actions"><button class="btn" id="themeBtn">Theme</button><button class="btn" id="authBtn">Sign in</button></div></header><section class="content" id="content"></section><div class="composer"><div class="composerTools"><button class="iconBtn" id="micBtn">🎙</button><button class="iconBtn" id="researchBtn">🌐</button><button class="iconBtn" id="uploadBtn">📎</button><span class="toolState" id="toolState">Voice ready · Research off · Files ready</span><input id="fileInput" type="file" hidden accept="image/*,.pdf,.txt,.md,.csv,.doc,.docx"></div><div class="box"><textarea id="message" rows="1" placeholder="Message Angel…"></textarea><button class="send" id="sendBtn">↑</button></div><small id="footerStatus">Sign in to unlock persistent conversations.</small></div></main></div><div class="modal" id="modal"><div class="auth"><h2>Enter Angel</h2><p>Continue securely with your Google account.</p><button id="googleBtn">ⓖ Continue with Google</button><button id="closeBtn">Cancel</button><div class="statusText" id="authStatus"></div></div></div><script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const URL="https://ybvyveonfvixsfusoqqz.supabase.co",KEY="sb_publishable_N5oJC6pzx87-z3pO8MgSwQ_djYeX8o9",supabase=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=s=>document.querySelector(s),content=$("#content"),input=$("#message"),tools=URL+"/functions/v1/angel-tools",orch=URL+"/functions/v1/angel-orchestrator";let session=null,profile=null,conversationId=null,sending=false,recording=false,recorder=null,stream=null,researchMode=false;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),meta=u=>u?.user_metadata||{};const username=u=>profile?.username||meta(u).user_name||meta(u).preferred_username||meta(u).full_name||meta(u).name||u?.email?.split("@")[0]||"Angel user";
function account(u){$("#authBtn").textContent=u?"Sign out":"Sign in";$("#sideAuth").textContent=u?"◉ Sign out":"◉ Sign in";$("#footerStatus").textContent=u?"Angel remembers this conversation securely in your account.":"Sign in to unlock persistent conversations.";$("#sideUser").innerHTML=u?`<strong>${esc(username(u))}</strong>${esc(u.email||"")}`:`<strong>Guest mode</strong>Sign in to save conversations.`}
async function auth(){let{data}=await supabase.auth.getSession();session=data.session||null;if(session){let r=await supabase.from("profiles").select("*").eq("id",session.user.id).maybeSingle();profile=r.data||null}account(session?.user||null);return session}
function welcome(){content.innerHTML=`<div class="welcome"><div class="orb">✦</div><h1>Hello. I’m <span>Angel.</span></h1><p>Your private AI companion for reasoning, research, memory, voice, vision, documents and agent workflows.</p><div class="cards"><button class="card" data-s="Help me create something extraordinary"><b>✦ Create something</b><small>Turn an idea into something real.</small></button><button class="card" data-s="Research this topic and explain the important findings"><b>🌐 Research this</b><small>Search the web and bring useful signal.</small></button><button class="card" data-s="Help me think through a difficult problem"><b>🧠 Think with me</b><small>Explore a problem deeply.</small></button></div></div>`;document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{input.value=b.dataset.s;send()})}
function messages(){if(!content.querySelector(".messages"))content.innerHTML='<div class="messages"></div>';return content.querySelector(".messages")}
function add(role,text,sources=[]){let d=document.createElement("div");d.className="msg";d.innerHTML=`<div class="role">${role==="user"?"YOU":"✦ ANGEL"}</div><div><p>${esc(text)}</p>${role==="assistant"?'<button class="mini speak">🔊 Listen</button>':''}${sources.length?`<div class="sourceBox"><b>Sources</b>${sources.slice(0,8).map((s,i)=>`<div>${i+1}. <a target="_blank" rel="noopener" href="${esc(s.url||s.link||"#")}">${esc(s.title||s.url||s.link||"Source")}</a></div>`).join("")}</div>`:""}</div>`;messages().append(d);d.querySelector(".speak")?.addEventListener("click",()=>speak(text));return d}
async function call(path,body){if(!session)throw Error("Please sign in first.");let r=await fetch(path,{method:"POST",headers:{Authorization:`Bearer ${session.access_token}`,"Content-Type":"application/json","apikey":KEY},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.detail||`Request failed (${r.status})`);return d}
async function send(){if(sending||!input.value.trim())return;if(!session){$("#modal").classList.add("open");return}let text=input.value.trim();input.value="";sending=true;add("user",text);let thinking=add("assistant","Angel is thinking…");try{let plan=await call(orch,{task:text,mode:researchMode?"research":"auto"});if(plan.research_required||researchMode){let r=await call(tools,{action:"research",query:text,max_results:8});thinking.remove();add("assistant",plan.answer||"I researched this for you.",r.results||[])}else{let r=await fetch(URL+"/functions/v1/angel-chat",{method:"POST",headers:{Authorization:`Bearer ${session.access_token}`,"Content-Type":"application/json","apikey":KEY},body:JSON.stringify({message:text,conversation_id:conversationId})});let d=await r.json();if(!r.ok)throw Error(d.error||d.detail||"Angel chat failed");conversationId=d.conversation_id||conversationId;thinking.remove();add("assistant",d.reply||d.message||"I’m ready.")}}catch(e){thinking.remove();add("assistant",e.message||"Angel could not complete that request.")}finally{sending=false}}
async function speak(text){try{let d=await call(tools,{action:"speak",text});let b=atob(d.audio_base64),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);new Audio(URL.createObjectURL(new Blob([a],{type:d.mime_type||"audio/wav"}))).play()}catch(e){alert(e.message)}}
async function toggleMic(){if(recording){recorder.stop();return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});let chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=async()=>{recording=false;$("#micBtn").classList.remove("active");stream.getTracks().forEach(t=>t.stop());let blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"}),reader=new FileReader();reader.onload=async()=>{try{let d=await call(tools,{action:"transcribe",audio_base64:reader.result,mime_type:blob.type});input.value=d.text||"";if(d.text)send()}catch(e){alert(e.message)}};reader.readAsDataURL(blob)};recorder.start();recording=true;$("#micBtn").classList.add("active")}catch(e){alert("Microphone access is unavailable.")}}
$("#micBtn").onclick=toggleMic;$("#researchBtn").onclick=()=>{researchMode=!researchMode;$("#researchBtn").classList.toggle("active",researchMode);$("#toolState").textContent=`Voice ready · Research ${researchMode?"on":"off"} · Files ready`};$("#uploadBtn").onclick=()=>$("#fileInput").click();$("#fileInput").onchange=async e=>{let f=e.target.files[0];if(!f)return;input.value=`Analyze this uploaded file: ${f.name}`;add("user",`📎 ${f.name}`);try{let reader=new FileReader();reader.onload=async()=>{try{let r=await call(URL+"/functions/v1/angel-documents",{action:"analyze",file_name:f.name,mime_type:f.type,data_base64:String(reader.result).split(",")[1]||""});add("assistant",r.answer||r.text||"Document analyzed.")}catch(x){add("assistant",x.message)}};reader.readAsDataURL(f)}catch(x){add("assistant",x.message)}};

</script></body></html>
