name: Integrate Angel Phase 2 UI
on:
  push:
    paths:
      - 'site/angel-agent.js'
      - '.github/workflows/integrate-phase2-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Phase 2 UI script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script type="module" src="/angel-agent.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name 'angel-phase2-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site/index.html
          git diff --cached --quiet || git commit -m 'Integrate Phase 2 agent UI'
          git push
