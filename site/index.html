<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#09090e">
<title>Angel ✦</title>
<style>
:root{--bg:#09090e;--panel:#111119;--soft:#181722;--text:#f5f2fa;--muted:#96919f;--line:#ffffff12;--a:#a878ff}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 65% 10%,#8b55ff18,transparent 28%),var(--bg);color:var(--text)}.app{min-height:100vh;display:flex}.side{width:260px;padding:18px 12px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{font-weight:800;letter-spacing:4px;padding:10px;font-size:14px}.brand b{color:var(--a);font-size:21px;margin-right:8px}.new,.nav button{border:0;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer;border-radius:12px}.new{padding:13px;margin:16px 2px;border:1px solid #a878ff44;display:flex;gap:9px;align-items:center}.nav{display:grid;gap:4px}.nav button{padding:11px;color:var(--muted)}.nav button:hover{background:var(--soft);color:var(--text)}.grow{flex:1}main{flex:1;min-width:0;display:flex;flex-direction:column}header{height:70px;padding:0 28px;display:flex;align-items:center}.pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px}.dot{display:inline-block;width:7px;height:7px;background:#64e6aa;border-radius:50%;margin-right:8px}.actions{margin-left:auto}.icon,.signin{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 14px;cursor:pointer}.icon{display:none}section{flex:1;display:flex;justify-content:center;padding:7vh 24px 140px}.hero{max-width:820px;width:100%;text-align:center;align-self:center}.orb{width:108px;height:108px;margin:auto auto 24px;border-radius:50%;display:grid;place-items:center;font-size:32px;color:white;background:radial-gradient(circle,#d7c0ff,#7b45d7 45%,#7b45d711 70%);box-shadow:0 0 90px #8b55ff33}h1{font-size:clamp(42px,6vw,68px);letter-spacing:-3px;margin:0 0 13px}h1 span{color:var(--a)}.hero>p{max-width:650px;margin:auto;color:var(--muted);line-height:1.7;font-size:17px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:38px}.cards button{min-height:150px;padding:18px;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:18px;cursor:pointer}.cards strong,.cards small{display:block}.cards small{color:var(--muted);margin-top:9px;line-height:1.45}.cards button:hover{transform:translateY(-3px);border-color:#a878ff66}.messages{width:min(820px,100%)}.msg{display:grid;grid-template-columns:70px 1fr;border-bottom:1px solid var(--line);padding:20px 0}.msg b{font-size:11px;color:var(--a)}.msg p{margin:0;line-height:1.7}.compose{position:fixed;bottom:0;left:260px;right:0;padding:25px 24px 8px;background:linear-gradient(transparent,var(--bg) 30%)}.box{max-width:820px;margin:auto;display:flex;gap:8px;padding:8px;border:1px solid var(--line);border-radius:22px;background:var(--panel)}textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:inherit;padding:11px}.send{width:42px;border:0;border-radius:13px;background:var(--a);color:#fff;font-size:20px;cursor:pointer}.compose small{display:block;text-align:center;color:var(--muted);margin:8px}.light{--bg:#f8f7fb;--panel:#fff;--soft:#f0eef7;--text:#191720;--muted:#746f7c;--line:#17121d14;--a:#7b45d7}@media(max-width:760px){.side{display:none}.icon{display:inline-block}.compose{left:0}.cards{grid-template-columns:1fr}.hero{align-self:flex-start;margin-top:30px}header{padding:0 14px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand"><b>✦</b>ANGEL</div><button class="new" onclick="resetChat()">＋ New conversation</button><div class="nav"><button>✦ Angel</button><button>◷ History</button><button>⌕ Explore</button><button>▣ Projects</button></div><div class="grow"></div><div class="nav"><button>⚙ Settings</button><button onclick="alert('Authentication will be connected in Phase 2.')">◉ Sign in</button></div></aside>
<main><header><button class="icon" onclick="document.body.classList.toggle('light')">☼</button><div class="pill"><span class="dot"></span>Angel</div><div class="actions"><button class="signin" onclick="document.body.classList.toggle('light')">Theme</button></div></header>
<section id="content"><div class="hero"><div class="orb">✦</div><h1>Hello. I’m <span>Angel.</span></h1><p>An evolving AI companion built to help you think, create, remember and eventually take meaningful action.</p><div class="cards"><button onclick="suggest('Help me create something extraordinary')"><strong>✦ Create something</strong><small>Turn an idea into something real.</small></button><button onclick="suggest('Help me think through a difficult problem')"><strong>⌕ Think with me</strong><small>Explore a problem deeply.</small></button><button onclick="suggest('Help me organize a project')"><strong>▣ Build a project</strong><small>Give your work a home and direction.</small></button></div></div></section>
<div class="compose"><div class="box"><textarea id="message" rows="1" placeholder="Message Angel…"></textarea><button class="send" onclick="send()">↑</button></div><small>Angel is in foundation mode. Important actions should always be verified.</small></div>
</main></div>
<script>
const input=document.getElementById('message'),content=document.getElementById('content');
function suggest(t){input.value=t;input.focus()}
function resetChat(){location.reload()}
function send(){const t=input.value.trim();if(!t)return;if(!content.querySelector('.messages'))content.innerHTML='<div class="messages"></div>';const m=content.querySelector('.messages');m.insertAdjacentHTML('beforeend','<div class="msg"><b>YOU</b><p>'+escapeHtml(t)+'</p></div><div class="msg"><b>✦ ANGEL</b><p>I’m here. You’ve reached the Angel foundation successfully. The interface is alive, and the next phase is building the real intelligence behind it.</p></div>');input.value='';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}})
</script>
</body></html>
