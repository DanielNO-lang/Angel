import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const URL="https://ybvyveonfvixsfusoqqz.supabase.co",KEY="sb_publishable_N5oJC6pzx87-z3pO8MgSwQ_djYeX8o9",db=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=s=>document.querySelector(s),content=$("#content"),input=$("#message"),sendBtn=$("#sendBtn");let session=null,conversationId=null,history=[],profile=null,sending=false;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c])),meta=u=>u?.user_metadata||{};function name(u){return profile?.username||meta(u).user_name||meta(u).preferred_username||meta(u).full_name||meta(u).name||u?.email?.split("@")[0]||"Angel user"}function display(u){return profile?.display_name||meta(u).full_name||meta(u).name||meta(u).user_name||u?.email?.split("@")[0]||"Angel user"}function update(u){if(!u){$("#accountName").textContent="Angel user";$("#accountEmail").textContent="";$("#avatar").textContent="A";$("#sideUser").innerHTML="<strong>Guest mode</strong>Sign in to save conversations.";return}let n=name(u),e=u.email||"",p=meta(u).avatar_url||meta(u).picture||profile?.avatar_url;$("#accountName").textContent=n;$("#accountEmail").textContent=e;$("#sideUser").innerHTML="<strong>"+esc(display(u))+"</strong>"+esc(e);$("#avatar").innerHTML=p?'<img src="'+esc(p)+'" alt="">':esc((n[0]||"A").toUpperCase())}async function profileLoad(){if(!session){profile=null;update(null);return}let{data,error}=await db.from("profiles").select("id,username,display_name,avatar_url").eq("id",session.user.id).maybeSingle();if(error)console.warn(error);profile=data||null;update(session.user)}async function refresh(){let{data,error}=await db.auth.getSession();if(error)console.error(error);session=data.session||null;await profileLoad();let ok=!!session;$("#authBtn").textContent=ok?"Sign out":"Sign in";$("#sideAuth").textContent=ok?"◉ Sign out":"◉ Sign in";$("#footerStatus").textContent=ok?"Angel remembers this conversation securely in your account.":"Sign in to unlock Angel's persistent conversations.";return session}function welcome(){content.innerHTML='<div class="welcome"><div class="orb">✦</div><h1>Hello. I’m <span>Angel.</span></h1><p>A private AI companion built to remember context, think with you, and eventually act on your behalf.</p><div class="cards"><button class="card" data-s="Help me create something extraordinary"><strong>✦ Create something</strong><small>Turn an idea into something real.</small></button><button class="card" data-s="Help me think through a difficult problem"><strong>⌕ Think with me</strong><small>Explore a problem deeply and clearly.</small></button><button class="card" data-s="Help me organize a project"><strong>▣ Build a project</strong><small>Give your work structure and direction.</small></button></div></div>';bind()}function mv(){if(!content.querySelector(".messages"))content.innerHTML='<div class="messages"></div>';return content.querySelector(".messages")}function add(r,t,err=false){mv().insertAdjacentHTML("beforeend",'<div class="msg '+(err?"error":"")+'"><div class="role">'+(r==="user"?"YOU":"✦ ANGEL")+'</div><p>'+esc(t)+'</p></div>')}function reset(){conversationId=null;history=[];welcome();input.focus()}function openAuth(){$("#modal").classList.add("open")}function closeAuth(){$("#modal").classList.remove("open");$("#authStatus").textContent=""}async function ensureConv(text){if(conversationId)return;let{data,error}=await db.from("conversations").insert({user_id:session.user.id,title:text.slice(0,80)||"New conversation"}).select("id").single();if(error)throw error;conversationId=data.id}async function save(role,text){let{error}=await db.from("messages").insert({conversation_id:conversationId,user_id:session.user.id,role,content:text});if(error)throw error}async function ask(){let{data,error}=await db.functions.invoke("angel-chat",{body:{messages:history}});if(error){let msg=error.message||"Angel's reasoning engine returned an error.";try{if(error.context instanceof Response){let t=await error.context.clone().text(),p=JSON.parse(t);msg=p.error||msg}}catch(_){}throw Error(msg)}if(!data?.reply)throw Error(data?.error||"Angel returned no response.");return data.reply}async function send(){if(sending)return;let text=input.value.trim();if(!text)return;if(!session)session=await refresh();if(!session){openAuth();return}sending=true;sendBtn.disabled=true;input.value="";input.style.height="auto";add("user",text);history.push({role:"user",content:text});try{await ensureConv(text);await save("user",text);$("#brainStatus").textContent="Angel is thinking…";let reply=await ask();add("assistant",reply);history.push({role:"assistant",content:reply});await save("assistant",reply);await db.from("conversations").update({updated_at:new Date().toISOString()}).eq("id",conversationId)}catch(e){console.error(e);add("assistant",e.message||"Something interrupted Angel's thought process.",true)}finally{sending=false;sendBtn.disabled=false;$("#brainStatus").textContent="Angel brain online"}}async function openConv(id){if(!session)return openAuth();let{data:c,error:ce}=await db.from("conversations").select("id,title").eq("id",id).eq("user_id",session.user.id).maybeSingle();if(ce||!c)return add("assistant",ce?.message||"Conversation not found.",true);let{data:m,error:me}=await db.from("messages").select("role,content,created_at").eq("conversation_id",id).eq("user_id",session.user.id).order("created_at");if(me)return add("assistant",me.message,true);conversationId=id;history=(m||[]).map(x=>({role:x.role,content:x.content}));mv().innerHTML="";(m||[]).forEach(x=>add(x.role,x.content));window.scrollTo(0,document.body.scrollHeight)}async function historyView(){if(!session)session=await refresh();if(!session)return openAuth();let{data,error}=await db.from("conversations").select("id,title,updated_at").eq("user_id",session.user.id).order("updated_at",{ascending:false}).limit(50);if(error)return add("assistant",error.message,true);content.innerHTML='<h2 class="panelTitle">History</h2><p class="panelLead">Your saved Angel conversations.</p><div class="list">'+((data||[]).map(x=>'<button class="listItem" data-id="'+esc(x.id)+'"><strong>'+esc(x.title)+"</strong><small>"+new Date(x.updated_at).toLocaleString()+"</small></button>").join("")||'<p class="panelLead">Your history is empty for now.</p>')+'</div>';content.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>openConv(b.dataset.id))}function explore(){content.innerHTML='<h2 class="panelTitle">Explore</h2><p class="panelLead">Angel’s foundation is online. Research, tools, voice, vision and agent workflows will attach here in their dedicated phases.</p><div class="cards"><div class="card"><strong>🧠 Think</strong><small>Reasoning and structured problem solving.</small></div><div class="card"><strong>🌐 Research</strong><small>Web research is a later capability.</small></div><div class="card"><strong>⚙ Tools</strong><small>Actions will run behind permissions.</small></div></div>'}function projects(){content.innerHTML='<h2 class="panelTitle">Projects</h2><p class="panelLead">The project workspace is reserved for the project layer, while core conversations remain persistent and recoverable.</p><div class="list"><div class="listItem"><strong>Workspace foundation</strong><small>Ready for the dedicated project system.</small></div></div>'}async function settings(){if(!session)session=await refresh();if(!session)return openAuth();let u=profile||{};content.innerHTML='<h2 class="panelTitle">Settings</h2><p class="panelLead">Manage the profile attached to your Angel account.</p><form class="form" id="pf"><div class="field"><label>Username</label><input id="un" maxlength="32" value="'+esc(u.username||name(session.user))+'" required pattern="[A-Za-z0-9_]{3,32}"></div><div class="field"><label>Display name</label><input id="dn" maxlength="80" value="'+esc(u.display_name||display(session.user))+'"></div><button class="save">Save profile</button><div class="statusText" id="ss"></div></form>';$("#pf").onsubmit=async e=>{e.preventDefault();let un=$("#un").value.trim(),dn=$("#dn").value.trim()||null;if(!/^[A-Za-z0-9_]{3,32}$/.test(un))return $("#ss").textContent="Username must be 3–32 letters, numbers or underscores.";$("#ss").textContent="Saving…";let{data,error}=await db.from("profiles").update({username:un,display_name:dn}).eq("id",session.user.id).select().single();if(error)return $("#ss").textContent=error.message;profile=data;update(session.user);$("#ss").textContent="Profile saved."}}function bind(){content.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{input.value=b.dataset.s;input.focus()})}async function signOut(){let{error}=await db.auth.signOut();if(error)return $("#authStatus").textContent=error.message;session=null;profile=null;reset();await refresh()}$("#authBtn").onclick=async()=>{let s=await db.auth.getSession();s.data.session?signOut():openAuth()};$("#sideAuth").onclick=async()=>{let s=await db.auth.getSession();s.data.session?signOut():openAuth()};$("#googleBtn").onclick=async()=>{let{error}=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin}});if(error)$("#authStatus").textContent=error.message};$("#closeBtn").onclick=closeAuth;$("#newChat").onclick=reset;$("#angelBtn").onclick=reset;$("#historyBtn").onclick=historyView;$("#exploreBtn").onclick=explore;$("#projectsBtn").onclick=projects;$("#settingsBtn").onclick=settings;$("#themeBtn").onclick=()=>{document.body.classList.toggle("light");localStorage.setItem("angel_theme",document.body.classList.contains("light")?"light":"dark")};sendBtn.onclick=send;input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};input.oninput=()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,160)+"px"};db.auth.onAuthStateChange((_e,s)=>{setTimeout(async()=>{session=s;await profileLoad();update(session?.user||null);$("#authBtn").textContent=session?"Sign out":"Sign in";$("#sideAuth").textContent=session?"◉ Sign out":"◉ Sign in";$("#footerStatus").textContent=session?"Angel remembers this conversation securely in your account.":"Sign in to unlock Angel's persistent conversations.";closeAuth()},0)});if(localStorage.getItem("angel_theme")==="light")document.body.classList.add("light");welcome();refresh();
