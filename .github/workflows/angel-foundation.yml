name: Angel foundation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production files
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f netlify.toml
          test -f supabase/config.toml
          test -f supabase/functions/angel-chat/index.ts
          test -f supabase/migrations/20260902115218_angel_brain_memory_foundation.sql
          test -f supabase/migrations/20260907070100_angel_foundation_hardening.sql
          test -f supabase/migrations/20260907071000_angel_security_linter_cleanup.sql
          grep -q 'publish = "."' netlify.toml
          grep -q 'verify_jwt = true' supabase/config.toml
          grep -q 'GEMINI_API_KEY' supabase/functions/angel-chat/index.ts
          if grep -RniE '(AIzaSy|sk-[A-Za-z0-9_-]{20,}|service_role)' site supabase/functions; then
            echo 'Potential secret found in client/server source.'
            exit 1
          fi
      - name: Validate no obsolete frontend remains
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src
          test ! -e package.json
          test ! -e vite.config.js
      - name: Parse production JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('site/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script type="module">\s*(.*?)\s*</script>', html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected exactly one module script, found {len(scripts)}')
          Path('/tmp/angel-app.mjs').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/angel-app.mjs
