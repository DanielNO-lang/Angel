function messages(){if(!content.querySelector(".messages"))content.innerHTML='<div class="messages"></div>';return content.querySelector(".messages")}function add(role,text,error=false,sources=[]){const id="m"+Date.now()+Math.random().toString(16).slice(2);let html='<div class="msg '+(error?"error":"")+'" data-mid="'+id+'"><div class="role">'+(role==="user"?"YOU":"✦ ANGEL")+'</div><div><p>'+esc(text)+'</p>';if(role==="assistant")html+='<div class="tools"><button class="mini speak" data-text="'+esc(text.slice(0,2000))+'">🔊 Listen</button></div>';if(sources.length){html+='<div class="sourceBox"><strong>Sources</strong>'+sources.slice(0,8).map((s,i)=>'<div style="margin-top:8px">'+(i+1)+'. <a href="'+esc(s.url||s.link||"#")+'" target="_blank" rel="noopener">'+esc(s.title||s.name||s.url||"Source")+'</a></div>').join("")+'</div>'}html+='</div></div>';messages().insertAdjacentHTML("beforeend",html);const el=content.querySelector('[data-mid="'+id+'"]');el?.querySelector(".speak")?.addEventListener("click",()=>speak(text));return id}

async function ensureConversation(t){if(conversationId)return;const{data,error}=await supabase.from("conversations").insert({user_id:session.user.id,title:t.slice(0,80)||"New conversation"}).select("id").single();if(error)throw error;conversationId=data.id}async function save(role,text,metadata={}){const{error}=await supabase.from("messages").insert({conversation_id:conversationId,user_id:session.user.id,role,content:text,metadata});if(error)throw error}

async function memories(){if(!session)return[];const{data}=await supabase.from("memories").select("id,kind,content,importance").eq("user_id",session.user.id).order("importance",{ascending:false}).limit(20);return data||[]}

async function invoke(){if(!session?.access_token)throw new Error("Your Angel session expired. Please sign in again.");let context=[];const ms=await memories();if(ms.length)context.push("Long-term memory available for this user:\n"+ms.map(m=>"- "+m.content).join("\n"));let sources=[];if(researchMode){sources=await research(history.filter(x=>x.role==="user").at(-1)?.content||input.value);if(sources.length)context.push("Fresh web research results. Use them carefully and cite source titles/URLs in the answer when useful:\n"+sources.map((s,i)=>`${i+1}. ${s.title||s.name||"Source"} | ${s.url||s.link||""}\n${s.content||s.snippet||s.description||""}`).join("\n\n"))}const msgs=[...context.map(content=>({role:"system",content})),...history.slice(-24)];const r=await fetch(URL+"/functions/v1/angel-chat",{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+session.access_token},body:JSON.stringify({messages:msgs})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d?.error||"Angel could not respond.");return{reply:d.reply,sources,provider:d.provider,model:d.model}}
async function send(){if(sending||!navigator.onLine)return;if(!session)session=await auth();if(!session){openAuth();return}const text=input.value.trim();if(!text)return;sending=true;sendBtn.disabled=true;input.value="";input.style.height="auto";add("user",text);history.push({role:"user",content:text});try{await ensureConversation(text);await save("user",text);await saveMemory(text);$("#brainStatus").textContent=researchMode?"Angel is researching…":"Angel is thinking…";thinking(true);const r=await invoke();thinking(false);add("assistant",r.reply,false,r.sources);history.push({role:"assistant",content:r.reply});await save("assistant",r.reply,{provider:r.provider,model:r.model,research:researchMode,sources:r.sources?.slice(0,8)||[]});await supabase.from("conversations").update({updated_at:new Date().toISOString()}).eq("id",conversationId).eq("user_id",session.user.id)}catch(e){thinking(false);console.error(e);add("assistant",e.message||"Angel encountered an unexpected error.",true)}finally{researchMode=false;$("#researchBtn").classList.remove("active");$("#toolState").textContent="Voice ready · Research off";sending=false;sendBtn.disabled=false;$("#brainStatus").textContent=navigator.onLine?"Angel brain online":"Offline";setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}),0)}}

async function settingsView(){if(!session)session=await auth();if(!session){openAuth();return}const u=profile||{};content.innerHTML='<h2 class="panelTitle">Settings</h2><p class="panelLead">Manage your Angel profile and capability status.</p><form class="form" id="profileForm"><div class="field"><label>Username</label><input id="username" maxlength="32" value="'+esc(u.username||username(session.user))+'" required></div><div class="field"><label>Display name</label><input id="displayName" maxlength="80" value="'+esc(u.display_name||displayName(session.user))+'"></div><button class="save">Save profile</button><div class="statusText" id="settingsStatus"></div></form><div class="list" style="margin-top:28px"><div class="listItem"><strong>🧠 AI providers</strong><small>Automatic provider routing and fallback are active on the server.</small></div><div class="listItem"><strong>🗃 Long-term memory</strong><small>Explicit memories are stored privately in your account.</small></div></div>';$("#profileForm").onsubmit=async e=>{e.preventDefault();const un=$("#username").value.trim(),dn=$("#displayName").value.trim()||null,st=$("#settingsStatus");if(!/^[A-Za-z0-9_]{3,32}$/.test(un)){st.textContent="Username must be 3–32 letters, numbers or underscores.";return}st.textContent="Saving…";const{data,error}=await supabase.from("profiles").update({username:un,display_name:dn,updated_at:new Date().toISOString()}).eq("id",session.user.id).select().single();if(error){st.textContent=error.message;return}profile=data;account(session.user);st.textContent="Profile saved."}}

$("#authBtn").onclick=authAction;$("#sideAuth").onclick=authAction;$("#googleBtn").onclick=async()=>{const st=$("#authStatus");st.textContent="Opening Google…";const{error}=await supabase.auth.signInWithOAuth({provider:"google",options:{redirectTo:window.location.origin}});if(error)st.textContent=error.message};$("#closeBtn").onclick=closeAuth;$("#newChat").onclick=reset;$("#angelBtn").onclick=reset;$("#historyBtn").onclick=historyView;$("#exploreBtn").onclick=exploreView;$("#projectsBtn").onclick=projectsView;$("#settingsBtn").onclick=settingsView;$("#themeBtn").onclick=()=>{document.body.classList.toggle("light");localStorage.setItem("angel_theme",document.body.classList.contains("light")?"light":"dark")};$("#micBtn").onclick=toggleMic;$("#researchBtn").onclick=()=>{researchMode=!researchMode;$("#researchBtn").classList.toggle("active",researchMode);$("#toolState").textContent=researchMode?"Voice ready · Research on":"Voice ready · Research off"};sendBtn.onclick=send;input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,160)+"px"});window.addEventListener("online",()=>$("#brainStatus").textContent="Angel brain online");window.addEventListener("offline",()=>$("#brainStatus").textContent="Offline");supabase.auth.onAuthStateChange((_e,s)=>{setTimeout(async()=>{session=s;await loadProfile();const ok=!!s;$("#authBtn").textContent=ok?"Sign out":"Sign in";$("#sideAuth").textContent=ok?"◉ Sign out":"◉ Sign in";$("#footerStatus").textContent=ok?"Angel remembers this conversation securely in your account.":"Sign in to unlock Angel's persistent conversations.";if(ok&&!conversationId)await restoreLatest();closeAuth()},0)});async function restoreLatest(){const{data}=await supabase.from("conversations").select("id").eq("user_id",session.user.id).order("updated_at",{ascending:false}).limit(1).maybeSingle();if(data)await openConversation(data.id)}if(localStorage.getItem("angel_theme")==="light")document.body.classList.add("light");welcome();auth();
