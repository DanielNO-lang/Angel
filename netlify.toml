[build]
base = "site"
command = "echo 'Angel static production build'"
publish = "."

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/"
[headers.values]
Cache-Control = "no-store, max-age=0"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-store, max-age=0"
